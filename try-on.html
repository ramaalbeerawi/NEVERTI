<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual try-on | Neverti</title>
  <meta name="description" content="Try Neverti lipstick, eyeliner, blush and concealer on our model, your photo or your camera.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/tryon/tryon.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="tryon container">
    <header class="tryon__head">
      <p class="label">Virtual try-on</p>
      <h1 class="section-title">See it <em>on</em></h1>
      <p>Choose a shade and see it on our model, your own photo or your camera. Mix lips, face, cheeks, eyes and brows into one look.</p>
    </header>

    <div class="tryon__grid">
      <!-- ========== Left: the face ========== -->
      <div class="tryon__stage-col">
        <div class="tabs tryon__sources" role="tablist" aria-label="Choose a face">
          <button class="tab" type="button" role="tab" data-source="model" aria-selected="true">Our model</button>
          <button class="tab" type="button" role="tab" data-source="upload" aria-selected="false" tabindex="-1">Upload a photo</button>
          <button class="tab" type="button" role="tab" data-source="camera" aria-selected="false" tabindex="-1">Take a photo</button>
        </div>

        <div class="stage" id="stage">
          <canvas id="canvas" role="img" aria-label="Face with the selected makeup"></canvas>
          <video id="video" playsinline muted hidden></video>

          <!-- Messages: loading, camera blocked, no face found -->
          <div class="stage__status" id="status" role="status" hidden>
            <p id="status-text"></p>
            <div class="stage__status-actions" id="status-actions"></div>
          </div>

          <div class="stage__tools">
            <button class="btn stage__btn" type="button" id="compare" aria-pressed="false">Hold to see before</button>
            <label class="btn stage__btn" id="change-photo" hidden>
              Change photo
              <input class="visually-hidden" type="file" id="file" accept="image/*">
            </label>
          </div>
        </div>

        <p class="tryon__privacy">Everything happens on your device. No photo is uploaded.</p>
      </div>

      <!-- ========== Right: products ========== -->
      <aside class="tryon__panel stone-panel" aria-label="Makeup">
        <!-- Where it goes: tabs + Lip combo (filled by tryon.js) -->
        <div class="tryon__cats" id="cats"></div>

        <!-- The real products of this type (photo + name) -->
        <div class="tryon__products">
          <p class="shades__label" id="products-label">Product</p>
          <div class="tp-list" id="products" role="group" aria-labelledby="products-label"></div>
        </div>

        <!-- Its shades as color dots -->
        <div class="tryon__shades">
          <p class="shades__label" id="shade-label"></p>
          <div class="dots" id="dots" role="group" aria-labelledby="shade-label"></div>
        </div>

        <!-- The exact shade: real photo, name, shade code, price, Add to bag -->
        <div class="shade-card" id="shade-card" aria-live="polite"></div>

        <section class="wearing" aria-labelledby="wearing-title">
          <h2 id="wearing-title">Now wearing</h2>
          <p class="wearing__empty" id="wearing-empty">Nothing yet. Choose a shade to start your look.</p>
          <ul class="wearing__list" id="wearing"></ul>
          <div class="wearing__foot" id="wearing-foot" hidden>
            <p class="wearing__total"><span>Look total</span><span id="look-total"></span></p>
            <button class="btn btn--primary btn--block" type="button" id="add-look">Add this look to bag</button>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
